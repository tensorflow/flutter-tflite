name: Create release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from the main branch."
          exit 1

      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate release version
        id: version
        shell: bash
        run: |
          package_name=$(sed -n 's/^name: *//p' pubspec.yaml | tr -d "\"'")
          package_version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d "\"'")
          if [[ "$package_name" != "tflite_core" ]]; then
            echo "Expected package name 'tflite_core', got '$package_name'."
            exit 1
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: '$package_version'."
            exit 1
          fi
          tag="v$package_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag '$tag' already exists. Bump the package version before creating another release."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "tflite_core $RELEASE_TAG" --generate-notes
