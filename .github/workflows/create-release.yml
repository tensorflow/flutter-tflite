name: Create Release
run-name: Create Release for v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from pubspec.yaml, without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from the main branch."
          exit 1

      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_name=$(sed -n 's/^name: *//p' pubspec.yaml | tr -d "\"'")
          package_version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d "\"'")
          if [[ "$package_name" != "tflite_core" ]]; then
            echo "Expected package name 'tflite_core', got '$package_name'."
            exit 1
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: '$package_version'."
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "Requested version '$RELEASE_VERSION' does not match pubspec.yaml version '$package_version'."
            exit 1
          fi
          version_gt() {
            local candidate="${1%%+*}"
            local previous="${2%%+*}"
            local candidate_prerelease=""
            local previous_prerelease=""
            if [[ "$candidate" == *-* ]]; then
              candidate_prerelease="${candidate#*-}"
              candidate="${candidate%%-*}"
            fi
            if [[ "$previous" == *-* ]]; then
              previous_prerelease="${previous#*-}"
              previous="${previous%%-*}"
            fi
            local candidate_major candidate_minor candidate_patch
            local previous_major previous_minor previous_patch
            IFS=. read -r candidate_major candidate_minor candidate_patch <<< "$candidate"
            IFS=. read -r previous_major previous_minor previous_patch <<< "$previous"
            if ((10#$candidate_major != 10#$previous_major)); then
              ((10#$candidate_major > 10#$previous_major))
              return
            fi
            if ((10#$candidate_minor != 10#$previous_minor)); then
              ((10#$candidate_minor > 10#$previous_minor))
              return
            fi
            if ((10#$candidate_patch != 10#$previous_patch)); then
              ((10#$candidate_patch > 10#$previous_patch))
              return
            fi
            [[ -n "$previous_prerelease" && -z "$candidate_prerelease" ]]
          }
          tag="v$package_version"
          latest_version=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1 | sed 's/^v//')
          if [[ -n "$latest_version" ]]; then
            if ! version_gt "$package_version" "$latest_version"; then
              echo "Skipping release: '$package_version' is not newer than the latest release '$latest_version'."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "tflite_core $RELEASE_TAG" --generate-notes
